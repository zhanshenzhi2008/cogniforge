# =============================================================================
# cogniforge (Go 后端) 生产部署
# 部署位置：/opt/project/cogniforge/docker-compose.yml
# 单部署根目录：三个仓的 compose 都集中到 /opt/project/cogniforge/
# 方案 A：Traefik 仅路由前端；前端 Nginx 通过 cogniforge-net 代理 /api/*。
# 数据库：经 external 网络 db-net 访问 pgsql / redis。
# 镜像：CD 流程构建并推到 ghcr.io，此处只 pull + up
# =============================================================================

services:
  cogniforge:
    image: ghcr.io/${IMAGE_NAMESPACE:-zhanshenzhi2008}/cogniforge/cogniforge:latest
    container_name: cogniforge
    restart: unless-stopped
    expose:
      - "8080"
    # 本项目的全部非公开配置都来自同级 .env；不要提交该文件。
    env_file:
      - .env
    environment:
      GIN_MODE: release
      # ── 业务配置（云端不走 db.env 时也能跑）────────────────────
      AI_SERVICE_URL: http://cogniforge-ai:8086
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/logs:/app/logs
    networks:
      - cogniforge-net  # 仅供 Web 和 AI 服务内部访问
      - db-net          # 公用 PostgreSQL / Redis 网络
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cogniforge-net:
    external: true
    name: cogniforge-net
  db-net:
    external: true
    name: db-net
