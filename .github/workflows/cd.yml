# =============================================================================
# GitHub Actions CD 模板：cogniforge (Go)
# 适用：Docker Compose 部署
# 用法：放到 .github/workflows/cd.yml，改顶部 env 块
# =============================================================================

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: '选择部署服务'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cogniforge

# 防并发部署：同一个 ref 排队
concurrency:
  group: deploy-cogniforge-${{ github.ref }}
  cancel-in-progress: false

env:
  # ── 镜像相关（env，公开信息，不放 Secret）────────────────────
  IMAGE_REGISTRY: ghcr.io                                          # ← 改 1：ghcr.io / registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAMESPACE: ${{ github.repository_owner }}                  # ← 改 2：仓库 owner / 命名空间
  IMAGE_PROJECT: cogniforge                                         # ← 改 3：项目名
  IMAGE_NAME: cogniforge                                            # ← 改 4：compose.yml 里的镜像前缀（-server/-ai/-web 后缀）

  # ── 服务器部署路径（env）────────────────────────────────────
  # 单部署根目录：所有仓都部署到 /opt/project/cogniforge/，用不同 compose 文件
  DEPLOY_PATH: /opt/project/cogniforge                               # ← 统一部署根目录
  COMPOSE_FILE: docker-compose.yml                                  # ← 后端 compose
  COMPOSE_SERVICES: cogniforge                                     # ← 改 7：compose.yml 里的服务名（多个用空格分隔）

jobs:
  # ---------------------------------------------------------------------------
  # 构建 + 推送镜像
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.IMAGE_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner  }}
          password: ${{ secrets.IMAGE_REGISTRY_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_PROJECT }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 部署到远程服务器
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      # 私钥防呆：先验证 SSH key 是合法的、字节数合理
      # ⚠️ GitHub Secret UI 会 strip 末尾 \n，printf '%s\n' 保证文件以换行符结尾
      - name: Verify DEPLOY_SSH_KEY fingerprint
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "=== Key 校验 ==="
          wc -c ~/.ssh/deploy_key | awk '{print "字节数: " $1}'
          shasum -a 256 ~/.ssh/deploy_key | awk '{print "sha256: " $1}'
          ssh-keygen -l -f ~/.ssh/deploy_key | awk '{print "fingerprint: " $2 " (" $1 ")"}'

      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          script: |
            set -e
            echo "=== SSH OK $(whoami)@$(hostname) ==="

            # ── 1. 登录镜像仓库 ─────────────────────────────────────
            echo "${{ secrets.IMAGE_REGISTRY_TOKEN }}" | docker login ${{ env.IMAGE_REGISTRY }} -u "${{ github.repository_owner }}" --password-stdin

            # ── 2. 确保网络存在 ─────────────────────────────────────
            # db-net：由 /opt/project/envs/ 所在宿主机的 PostgreSQL/Redis 创建
            docker network inspect db-net >/dev/null 2>&1 || {
              echo "ERROR: db-net 不存在，请先确保 PostgreSQL/Redis 已部署并 join db-net"
              exit 1
            }
            # cogniforge-net：应用层网络，不存在则创建
            docker network inspect cogniforge-net >/dev/null 2>&1 || \
              docker network create cogniforge-net

            # ── 3. 验证部署目录与 compose 文件 ────────────────────────
            # 服务器只负责拉镜像，git clone 是首次手工做的（不会 git pull）
            if [ ! -d "${{ env.DEPLOY_PATH }}" ]; then
              echo "ERROR: 部署目录 ${{ env.DEPLOY_PATH }} 不存在，请先 git clone 该仓到此目录"
              exit 1
            fi
            if [ ! -f "${{ env.DEPLOY_PATH }}/${{ env.COMPOSE_FILE }}" ]; then
              echo "ERROR: ${{ env.DEPLOY_PATH }}/${{ env.COMPOSE_FILE }} 不存在"
              exit 1
            fi

            # ── 4. 拉新镜像（不跑 git）────────────────────────────────
            cd ${{ env.DEPLOY_PATH }}
            docker compose -f ${{ env.COMPOSE_FILE }} pull ${{ env.COMPOSE_SERVICES }}

            # ── 5. 滚动升级 ─────────────────────────────────────────
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --no-deps ${{ env.COMPOSE_SERVICES }}

            # ── 6. 清理旧镜像 ──────────────────────────────────────
            docker image prune -f --filter "until=72h"

            # ── 7. 健康检查 ────────────────────────────────────────
            sleep 15
            docker compose -f ${{ env.COMPOSE_FILE }} ps ${{ env.COMPOSE_SERVICES }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deploy failed"
          # 接 Slack / Discord / 邮件 webhook：
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"❌ cogniforge deploy to production failed: ${{ github.run_id }}"}'
