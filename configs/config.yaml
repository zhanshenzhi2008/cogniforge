server:
  port: ${PORT:-8080}
  mode: ${GIN_MODE:-debug}

database:
  host: ${PGSQL_HOST:-localhost}
  port: ${PGSQL_PORT:-5433}
  user: ${PGSQL_USERNAME:-postgres}
  password: ${PGSQL_PASSWORD:-postgres-root}
  dbname: ${PGSQL_DB:-cogniforge}
  sslmode: ${PGSQL_SSLMODE:-disable}

redis:
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}

encryption:
  key: ${ENCRYPTION_KEY:-}

rag:
  python_service_url: ${RAG_PYTHON_URL:-http://localhost:8086}

jwt:
  secret: ${JWT_SECRET:-cogniforge-secret-key}
  expire: 24h

log:
  level: ${LOG_LEVEL:-info}
  format: ${LOG_FORMAT:-json}
